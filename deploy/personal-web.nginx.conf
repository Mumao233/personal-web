server {
    server_name mumao.site;
    server_tokens off;
    client_max_body_size 310m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /api/setup { return 403; }
    location ~ (^|/)\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5193;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 125s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mumao.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mumao.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mumao.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mumao.site;
    return 404; # managed by Certbot


}
