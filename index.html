<!doctype html>
<html lang="zh-CN" data-theme="dark" data-surface="public">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0ede7" />
    <script>
      // Public pages use one palette. Only admin honors the saved manual theme,
      // and it mirrors resolvePageRoute: content parameters outrank page=admin.
      try {
        const root = document.documentElement;
        const color = document.querySelector('meta[name="theme-color"]');
        const params = new URLSearchParams(location.search);
        const content = ["answer", "survey", "post", "project", "story"].some((key) => params.has(key));
        const page = params.get("page") || "home";
        if (page === "admin" && !content) {
          const theme = localStorage.getItem("personal-space-theme") === "light" ? "light" : "dark";
          root.dataset.surface = "admin";
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          color.content = theme === "light" ? "#f6f2e9" : "#050505";
        } else if (page === "home" && !content) {
          color.content = "#2a2c30";
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="林珈诚的个人空间。学习、作品、文字，以及对世界的持续观察。"
    />
    <title>林珈诚 · 个人空间</title>

    <link rel="preload" href="/fonts/noto-serif-sc/H4chBXePl9DZ0Xe7gG9cyOj7oqP0dTpxZbB9E9gjjmzKvaeKHUTtJDWv3z-us4bxD8F5og.117.woff2" as="font" type="font/woff2" crossorigin />
    <!-- font-preloads:end -->
    <link rel="stylesheet" href="/fonts/noto-sans-sc.css" />
    <link rel="stylesheet" href="/fonts/noto-serif-sc.css" />
    <link rel="stylesheet" href="/fonts/instrument-serif.css" />
  </head>

    <div id="root"></div>
    <script type="module" blocking="render" src="/src/bootstrap.jsx"></script>
  </body>
</html>
